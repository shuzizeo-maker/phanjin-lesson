        <input type="range" min="0" max="1" step="0.05" id="sBgmVol" class="w-full mt-2"><div class="text-xs opacity-60 mt-1" id="bgmStatus"></div>
        <div class="text-xs opacity-60 mt-1">想換音樂？把新的音檔命名為 <code>bgm.mp3</code>，覆蓋同資料夾的舊檔即可。</div></div>
      <div class="paper-card p-3"><div class="flex items-center gap-3"><b class="kai text-lg flex-1">音效</b><button class="btn-ink" id="sSfx"></button><button class="btn-ink" id="sTest">試聽</button></div>
        <input type="range" min="0" max="1" step="0.05" id="sSfxVol" class="w-full mt-2"></div>
      <div class="flex flex-wrap gap-2">
        <button class="btn-ink" id="sFull">⛶ 全螢幕</button>
        <button class="btn-ink" data-open="teacher">🧑‍🏫 教師模式（題庫）</button>
        ${G && !G.over ? '<button class="btn-ink" id="sHome">🏠 回首頁（進度已自動儲存）</button>' : ''}
      </div>
    </div>`);
  const sync = () => { $('#sBgm').textContent = SND.cfg.bgmOn ? '開' : '關'; $('#sBgm').classList.toggle('on', SND.cfg.bgmOn);
    $('#sSfx').textContent = SND.cfg.sfxOn ? '開' : '關'; $('#sSfx').classList.toggle('on', SND.cfg.sfxOn); refreshAudioUI(); };
  $('#sBgmVol').value = SND.cfg.bgmVol; $('#sSfxVol').value = SND.cfg.sfxVol;
  $('#sBgm').onclick = () => { SND.cfg.bgmOn = !SND.cfg.bgmOn; SND.save(); SND.unlock(); SND.syncBgm(); sync(); };
  $('#sSfx').onclick = () => { SND.cfg.sfxOn = !SND.cfg.sfxOn; SND.save(); sync(); };
  $('#sBgmVol').oninput = e => SND.setBgmVol(+e.target.value);
  $('#sSfxVol').oninput = e => SND.setSfxVol(+e.target.value);
  $('#sTest').onclick = () => { SND.unlock(); SND.play('right'); setTimeout(() => SND.play('coin'), 500); setTimeout(() => SND.play('dice'), 900); };
  $('#sFull').onclick = () => { const d = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : (d.requestFullscreen || d.webkitRequestFullscreen || (()=>{})).call(d))?.catch?.(()=>{}); };
  const h = $('#sHome'); if (h) h.onclick = () => { save(); closeSheet(); unmountRenderer(); G = null; goTitle(); };
  sync();
}

/* ---------- 教師模式：題庫管理 ---------- */
let tFilter = '', tEditing = -1;
function openTeacher(){
  const cats = [...new Set([...CATS, ...QBANK.map(q => q.cat)])];
  const counts = cats.map(c => `${c} ${QBANK.filter(q => q.cat === c).length}`).join('・');
  const list = QBANK.map((q, i) => ({ q, i })).filter(x => !tFilter || x.q.cat === tFilter);
  openSheet(`
    <h2 class="kai text-3xl mb-1">🧑‍🏫 教師模式：題庫管理</h2>
    <p class="text-sm opacity-70 mb-3">目前共 ${QBANK.length} 題（${counts}）。修改會存在此瀏覽器；要帶到其他裝置請「匯出 JSON」。</p>
    <div class="flex flex-wrap gap-2 mb-3">
      <button class="btn-seal" id="tAdd">＋ 新增題目</button>
      <button class="btn-ink" id="tExpJ">匯出 JSON</button>
      <button class="btn-ink" id="tImpJ">匯入 JSON</button>
      <button class="btn-ink" id="tImpX">匯入 Excel</button>
      <button class="btn-ink" id="tExpX">匯出 Excel（範本）</button>
      <button class="btn-ink" id="tReset">還原預設題庫</button>
      <input type="file" id="tFileJ" accept=".json,application/json" style="display:none">
      <input type="file" id="tFileX" accept=".xlsx,.xls,.csv" style="display:none">
    </div>
    <div id="tEditor" style="display:none" class="paper-card p-3 mb-3"></div>
    <div class="flex items-center gap-2 mb-2"><span class="text-sm">篩選分類</span>
      <select id="tCat"><option value="">全部</option>${cats.map(c => `<option ${c===tFilter?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <span class="text-xs opacity-60 ml-auto">Excel 欄位：分類｜題目｜選項A｜選項B｜選項C｜選項D｜答案(A–D)｜解析</span></div>
    <div class="overflow-x-auto"><table class="tbl w-full">
      <thead><tr class="kai text-left"><th>#</th><th>分類</th><th>題目</th><th>答案</th><th></th></tr></thead>
      <tbody>${list.map(({ q, i }) => `<tr><td>${i+1}</td><td class="whitespace-nowrap">${esc(q.cat)}</td><td>${esc(q.q)}</td><td class="whitespace-nowrap">${LETTERS[q.a]}．${esc(q.o[q.a]).slice(0, 12)}</td>
        <td class="whitespace-nowrap"><button class="btn-ink text-sm" data-ed="${i}">編輯</button> <button class="btn-ink text-sm" data-del="${i}">刪除</button></td></tr>`).join('')}</tbody>
    </table></div>`);
  $('#tCat').onchange = e => { tFilter = e.target.value; openTeacher(); };
  $('#tAdd').onclick = () => editQuestion(-1);
  $$('[data-ed]').forEach(b => b.onclick = () => editQuestion(+b.dataset.ed));
  $$('[data-del]').forEach(b => b.onclick = () => { const i = +b.dataset.del; if (confirm(`確定刪除第 ${i+1} 題？\n${QBANK[i].q}`)){ QBANK.splice(i, 1); if (!QBANK.length) QBANK = DEFAULT_QUESTIONS.map(normQuestion); bankChanged(); openTeacher(); } });
  $('#tExpJ').onclick = () => download('fanjin-questions.json', JSON.stringify(QBANK, null, 2), 'application/json');
  $('#tImpJ').onclick = () => $('#tFileJ').click();
  $('#tFileJ').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const data = JSON.parse(await f.text()); importQuestions(Array.isArray(data) ? data : (data.questions || [])); } catch(err){ alert('JSON 格式錯誤：' + err.message); } };
  $('#tImpX').onclick = () => $('#tFileX').click();
  $('#tFileX').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const X = await loadXLSX(); const wb = X.read(await f.arrayBuffer()); const rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' }); importQuestions(rows.map(rowToQuestion)); } catch(err){ alert('Excel 讀取失敗：' + err.message); } };
  $('#tExpX').onclick = async () => { try { const X = await loadXLSX(); const ws = X.utils.json_to_sheet(QBANK.map(q => ({ 分類:q.cat, 題目:q.q, 選項A:q.o[0]||'', 選項B:q.o[1]||'', 選項C:q.o[2]||'', 選項D:q.o[3]||'', 答案:LETTERS[q.a], 解析:q.e }))); const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, '題庫'); X.writeFile(wb, 'fanjin-questions.xlsx'); } catch(err){ alert('無法載入 Excel 元件（需要網路）：' + err.message); } };
  $('#tReset').onclick = () => { if (confirm('確定還原為內建的 40 題預設題庫？目前的修改會消失。')){ QBANK = DEFAULT_QUESTIONS.map(normQuestion); bankChanged(); openTeacher(); } };
}
function editQuestion(i){
  tEditing = i; const q = i >= 0 ? QBANK[i] : { cat: tFilter || CATS[0], q:'', o:['','','',''], a:0, e:'' };
  const ed = $('#tEditor'); show(ed);
  ed.innerHTML = `
    <div class="kai text-xl mb-2">${i >= 0 ? `編輯第 ${i+1} 題` : '新增題目'}</div>
    <div class="grid gap-2">
      <label class="text-sm">分類 <input type="text" id="eCat" list="eCats" class="w-full" value="${esc(q.cat)}"><datalist id="eCats">${CATS.map(c => `<option value="${c}">`).join('')}</datalist></label>
      <label class="text-sm">題目 <textarea id="eQ" rows="2" class="w-full">${esc(q.q)}</textarea></label>
      ${[0,1,2,3].map(k => `<label class="text-sm flex items-center gap-2"><input type="radio" name="eA" value="${k}" ${q.a===k?'checked':''}> 選項${LETTERS[k]}${k>=2?'（可留空）':''} <input type="text" id="eO${k}" class="flex-1" value="${esc(q.o[k] || '')}"></label>`).join('')}
      <div class="text-xs opacity-60">點選左側圓鈕標示正確答案。只填 A、B 兩個選項即成為二選一（如是非題）。</div>
      <label class="text-sm">解析（答完後顯示） <textarea id="eE" rows="2" class="w-full">${esc(q.e)}</textarea></label>
      <div class="flex gap-2 justify-end"><button class="btn-ink" id="eCancel">取消</button><button class="btn-seal" id="eSave">儲存</button></div>
    </div>`;
  ed.scrollIntoView({ behavior:'smooth', block:'start' });
  $('#eCancel').onclick = () => hide(ed);
  $('#eSave').onclick = () => {
    const raw = [0,1,2,3].map(k => $(`#eO${k}`).value.trim());
    const a = +($('[name=eA]:checked') || { value:0 }).value;
    // 去掉空白選項，並重新對應正解索引
    const keep = raw.map((t, k) => ({ t, k })).filter(x => x.t);
    const nq = { cat: $('#eCat').value.trim() || '其他', q: $('#eQ').value.trim(), o: keep.map(x => x.t), a: keep.findIndex(x => x.k === a), e: $('#eE').value.trim() };
    if (!validQuestion(nq)) return alert('請填寫題目、至少兩個選項，並確認正確答案的選項不是空白。');
    if (tEditing >= 0) QBANK[tEditing] = normQuestion(nq); else QBANK.push(normQuestion(nq));
    bankChanged(); openTeacher(); toast('已儲存');
  };
}
function rowToQuestion(r){
  const get = (...ks) => { for (const k of ks) if (r[k] !== undefined && String(r[k]).trim() !== '') return String(r[k]).trim(); return ''; };
  const o = [get('選項A','A','optionA'), get('選項B','B','optionB'), get('選項C','C','optionC'), get('選項D','D','optionD')];
  return { cat: get('分類','類別','cat'), q: get('題目','問題','q','question'), o, a: get('答案','正解','answer','a'), e: get('解析','說明','e','explain') };
}
function importQuestions(arr){
  const out = [];
  (arr || []).forEach(x => {
    if (!x) return;
    let o = (x.o || x.options || []).map(s => String(s ?? '').trim());
    let a = x.a ?? x.answer;
    // 答案可為 A–D、1–4 或 0 起算的索引
    if (typeof a === 'string'){ const s = a.trim().toUpperCase(); a = 'ABCD'.includes(s) && s ? 'ABCD'.indexOf(s) : (parseInt(s) - 1); }
    else if (typeof a === 'number' && x.o === undefined && x.options === undefined) a = a - 1;
    const keep = o.map((t, k) => ({ t, k })).filter(z => z.t);
    const q = { cat: x.cat || x.category || '其他', q: x.q || x.question || '', o: keep.map(z => z.t), a: keep.findIndex(z => z.k === a), e: x.e || x.explain || '' };
    if (validQuestion(q)) out.push(normQuestion(q));
  });
  if (!out.length) return alert('沒有讀到有效題目。請確認格式（題目、至少兩個選項、正確答案）。');
  const replace = confirm(`讀到 ${out.length} 題有效題目。\n按「確定」＝取代現有題庫；按「取消」＝附加到現有題庫。`);
  QBANK = replace ? out : QBANK.concat(out); bankChanged(); openTeacher(); toast(`已匯入 ${out.length} 題`);
}
function bankChanged(){ saveBank(); if (G) G.qdeck = null; }
function download(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  const urls = ['https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'];
  return urls.reduce((p, u) => p.catch(() => new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error('載入失敗')); s.onerror = () => rej(new Error('載入失敗')); document.head.appendChild(s); })), Promise.reject());
}

/* =====================================================================
   十一、啟動與事件綁定
   ===================================================================== */
function goTitle(){
  show('#btnResume', STORE.get('save', null) ? 'block' : 'none');
  showScreen('scrTitle');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-open]'); if (!b) return;
  ({ rules:openRules, settings:openSettings, teacher:openTeacher })[b.dataset.open]();
});
$('#btnNew').onclick = () => { renderSetup(); showScreen('scrSetup'); };
$('#btnResume').onclick = resumeGame;
$('#btnSetupBack').onclick = goTitle;
$$('#pCountBtns button').forEach(b => b.onclick = () => { setupCfg.n = +b.dataset.n; renderSetup(); });
$('#selTime').onchange = e => { setupCfg.time = e.target.value; $('#inpTimeCustom').style.display = e.target.value === 'custom' ? 'block' : 'none'; };
$('#btnStart').onclick = () => startGame(readSetup());
$('#btnRoll').onclick = onRoll;
$('#btnMode').onclick = toggleMode;
$('#btnBgm').onclick = () => { SND.cfg.bgmOn = !SND.cfg.bgmOn; SND.save(); SND.unlock(); SND.syncBgm(); refreshAudioUI(); toast(SND.cfg.bgmOn ? '背景音樂：開' : '背景音樂：關', 1200); };
$('#btnSfx').onclick = () => { SND.cfg.sfxOn = !SND.cfg.sfxOn; SND.save(); refreshAudioUI(); toast(SND.cfg.sfxOn ? '音效：開' : '音效：關', 1200); };
$('#btnEnd').onclick = async () => {
  if (!G || G.over) return; if (busy) return toast('請先完成這一步，再結算');
  const v = await openModal({ title:'要現在放榜嗎？', badge:'榜', html:'<p class="kai text-lg">將結束本局並依聲望排名。</p>', buttons:[{ label:'再玩一下', value:0, cls:'btn-ink' }, { label:'放榜！', value:1 }] });
  if (v) endGame();
};
$('#btnHome').onclick = () => { G = null; goTitle(); };
$('#btnAgain').onclick = () => startGame(G ? G.cfg : readSetup());
$('#sheetLayer').addEventListener('click', e => { if (e.target.id === 'sheetLayer') closeSheet(); });
new ResizeObserver(() => { R && R.resize(); }).observe($('#boardHost'));
window.addEventListener('keydown', e => { if ((e.code === 'Space' || e.key === 'Enter') && $('#scrGame').style.display === 'flex' && $('#modalLayer').style.display !== 'flex' && $('#sheetLayer').style.display !== 'flex' && !busy) { e.preventDefault(); onRoll(); } });

SND.init(); refreshAudioUI(); goTitle();

// 測試／除錯用介面
window.FJ = { get G(){ return G; }, get R(){ return R; }, get busy(){ return busy; }, startGame, endGame, toggleMode, mountRenderer };
</script>
